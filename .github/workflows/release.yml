name: release
on:
  # Push a tag such as v0.1.0 ...
  push:
    tags: ["v*"]
  # ... or use the "Run workflow" button in the Actions tab, which tags the
  # tip of main with the version in pyproject.toml and releases it.
  workflow_dispatch:

permissions:
  contents: write  # needed to create the tag, the release and upload files to it

# Never run two releases at once.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pipx install poetry
      - name: Work out the tag and check it against the package version
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(poetry version --short)"
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
              echo "::error::run this workflow from main (it was run from ${GITHUB_REF_NAME})"
              exit 1
            fi
            tag="v${version}"
            if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}" >/dev/null 2>&1; then
              echo "::error::tag ${tag} already exists; bump the version with 'poetry version patch|minor|major' and merge that first"
              exit 1
            fi
          else
            tag="${GITHUB_REF_NAME}"
            if [ "${tag}" != "v${version}" ]; then
              echo "::error::tag ${tag} does not match pyproject.toml version ${version} (expected v${version})"
              exit 1
            fi
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
      - run: poetry env use "$(which python)"
      - run: poetry install
      - run: poetry run pytest -q
      - run: poetry build
      - name: Create the GitHub Release with the wheel and sdist attached
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            # Creates the tag on the commit this run tested and built.
            gh release create "${TAG}" dist/* --title "pbre ${TAG}" --generate-notes --target "${GITHUB_SHA}"
          else
            gh release create "${TAG}" dist/* --title "pbre ${TAG}" --generate-notes --verify-tag
          fi
